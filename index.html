<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocietyPro — Maintenance Management</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="logo-icon">🏢</span>
          <span class="logo-text">SocietyPro</span>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn-primary btn-full">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="reg-name" placeholder="John Sharma" required>
            </div>
            <div class="form-group">
              <label>Flat Number</label>
              <input type="text" id="reg-flat" placeholder="A-101" required>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="reg-phone" placeholder="+91 99999 99999">
            </div>
            <div class="form-group">
              <label>Wing</label>
              <input type="text" id="reg-wing" placeholder="A, B, C...">
            </div>
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="reg-role">
              <option value="member">Member</option>
              <option value="secretary">Secretary</option>
              <option value="treasurer">Treasurer</option>
              <option value="chairman">Chairman</option>
            </select>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Min 6 characters" required>
          </div>
          <div id="reg-error" class="form-error hidden"></div>
          <button type="submit" class="btn-primary btn-full">Create Account</button>
        </form>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">

      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="logo-icon">🏢</span>
          <span class="logo-text">SocietyPro</span>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <ul class="sidebar-nav" id="sidebar-nav"></ul>
        <button class="sidebar-logout" id="logout-btn">
          ⬅ Logout
        </button>
      </nav>

      <!-- Mobile toggle -->
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- Content -->
      <main class="content">
        <div class="page-area">
          <div id="page-container"></div>
        </div>
      </main>

    </div>
  </div>

  <!-- Modals -->
  <div id="modals"></div>

  <!-- Toasts -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/maintenance.js"></script>
  <script src="/js/pages/payments.js"></script>
  <script src="/js/pages/members.js"></script>
  <script src="/js/pages/notices.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
